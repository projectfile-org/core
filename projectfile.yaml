---
# SPDX-FileCopyrightText: 2026 Damián Búho <damian.buho@proton.me>
#
# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: core
  summary:
    en: Core Go library for the projectfile.org tools
    es: Biblioteca Go central para las herramientas de projectfile.org
    uk: Центральна бібліотека Go для інструментів projectfile.org
  title: Projectfile Core Go Library
  description:
    en: 'Core Go library shared by every projectfile.org tool: pf-cli, pf-bridge and pf-ci. It parses, resolves and validates projectfiles against the embedded v1 schema, exposing the typed model the tools build on. Published as a Go module for reuse across the projectfile fleet.'
    es: 'Biblioteca Go central compartida por todas las herramientas de projectfile.org: pf-cli, pf-bridge y pf-ci. Analiza, resuelve y valida projectfiles contra el esquema v1 embebido, exponiendo el modelo tipado sobre el que se construyen las herramientas. Publicada como módulo de Go para su reutilización en toda la flota de projectfile.'
    uk: 'Центральна бібліотека Go, спільна для всіх інструментів projectfile.org: pf-cli, pf-bridge і pf-ci. Розбирає, розвʼязує та валідує projectfile-файли за вбудованою схемою v1, відкриваючи типізовану модель, на якій побудовано інструменти. Опублікована як Go-модуль для повторного використання в усьому флоті projectfile.'
  version: 2.10.3
includes:
  - .makefile/core/ci.yaml
  - .makefile/library/languages/go.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/projectfile/metadata/raw/branch/main/include.yaml
keywords:
  - projectfile-core
  - projectfile
  - go
  - library
  - schema
  - validate
  - go-module
kind: SoftwareSourceCode
license:
  covers: project
  spdx: "MIT"
links:
  - label: Projectfile Specification
    type: more
    url: projectfile.org
  - label:
      en: Projectfile Core Go Library on kiota.ch
      es: Projectfile Core Go Library en kiota.ch
      uk: Projectfile Core Go Library на kiota.ch
    preferred: true
    type: source-code
    url: https://kiota.ch/projectfile/core
org:
  projectfile:
    ci:
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      nodes:
        module-published:
          needs:
            publish-go-module: true
            ready-to-publish: true
          when:
            events:
              - tag
        published:
          needs:
            module-published: true
      tools:
        publish-go-module:
          env:
            - FORGEJO_TOKEN
          gha: false
          image: GO_TOOL_IMAGE
          m6e: false
          run: .scripts/publish-go-module.sh "$${{ github.ref_name }}"
    status: maintained
    release:
      tag-prefix: v
repositories:
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/projectfile/core.git
