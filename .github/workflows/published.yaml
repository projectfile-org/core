  source-is-ready:
    runs-on: ubuntu-latest
    needs: ["projectfile-is-synced", "source-is-tested", "source-passes-lint"]
    steps:
      - run: echo source-is-ready
  source-is-secure:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /app/.cache/osv
