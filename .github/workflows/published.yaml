          image: ${{ vars.B19_DOCKER_REGISTRY }}/b19/go
          version: ${{ env.M6E_TAG }}
          run: go test -coverprofile=coverage.out ./...
          env: |-
            GOPROXY
          mounts: ${{ runner.temp }}/ci-cache/go:/app/.cache/go:rw
      - name: save go
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-${{ github.run_id }}
