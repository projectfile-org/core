---
# SPDX-FileCopyrightText: 2026 Damián Búho <damian.buho@proton.me>
#
# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
copyright:
  year: 2026
identity:
  created: "2026-06-01"
  name: core
  summary: Core Go library for projectfile.org tools
  title: projectfile/core
includes:
  - .makefile/core/ci.yaml
  - .makefile/library/languages/go.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/projectfile/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
org:
  projectfile:
    ci:
      forgejo:
        credentials:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      nodes:
        module-published:
          needs:
            publish-go-module: true
            ready-to-publish: true
          when:
            events:
              - tag
        published:
          needs:
            module-published: true
      tools:
        publish-go-module:
          env:
            - FORGEJO_TOKEN
          gha: false
          image: GO_TOOL_IMAGE
          m6e: false
          run: .scripts/publish-go-module.sh "$${{ github.ref_name }}"
    status: maintained
repositories:
  - role: mirror
    type: git
    url: ssh://git@codeberg.org/projectfile/core.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/projectfile-core.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/projectfile/core.git
links:
  - label: Projectfile Specification
    type: more
    url: projectfile.org
  - label: projectfile/core on Codeberg
    tags:
      - public
      - badges
      - badges-gitea
    type: source-code
    url: https://codeberg.org/projectfile/core
  - label: projectfile/core on GitHub
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/projectfile-core
  - label: projectfile/core on kiota.ch
    preferred: true
    type: source-code
    url: https://kiota.ch/projectfile/core
  - label: Issues on Codeberg
    type: bugs
    url: https://codeberg.org/projectfile/core/issues
  - label: Issues on GitHub
    type: bugs
    url: https://github.com/damian-buho/projectfile-core/issues
