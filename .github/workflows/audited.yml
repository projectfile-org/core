---
name: audited
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
jobs:
  audited:
    runs-on: ubuntu-latest
    needs: ["source-is-secure"]
    if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'schedule')
    steps:
      - uses: actions/checkout@v7
      - name: go-mod-list
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.B19_DOCKER_REGISTRY }}/b19/go
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: go list -u -m all
          env: |-
            GOPROXY
  source-is-secure:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /app/.cache/osv
    steps:
      - uses: actions/checkout@v7
      - name: restore grype-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scanner-db/grype-db
          key: scanner-db-grype-db-
          restore-keys: |
            scanner-db-grype-db-
      - name: grype-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-grype
          mounts: ${{ runner.temp }}/scanner-db/grype-db:/app/.cache/grype:ro
      - name: restore osv-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scanner-db/osv-db
          key: scanner-db-osv-db-
          restore-keys: |
            scanner-db-osv-db-
      - name: osv-scanner-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-osv-scanner --offline-vulnerabilities
          env: |-
            OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/app/.cache/osv
          mounts: ${{ runner.temp }}/scanner-db/osv-db:/app/.cache/osv:ro
      - name: restore trivy-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scanner-db/trivy-db
          key: scanner-db-trivy-db-
          restore-keys: |
            scanner-db-trivy-db-
      - name: trivy-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-trivy fs
          env: |-
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/scanner-db/trivy-db:/app/.cache/trivy:ro
