        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-golangci-lint
          env: |-
            GOPROXY
      - name: gosec
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-gosec
          env: |-
            GOPROXY
