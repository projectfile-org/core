---
name: published
"on":
  push: {}
  pull_request: {}
jobs:
  artifact-ready:
    runs-on: ubuntu-latest
    needs: ["built"]
    steps:
      - run: echo artifact-ready
  built:
    runs-on: ubuntu-latest
    needs: ["source-is-ready"]
    steps:
      - run: echo built
  documentation-is-ready:
    runs-on: ubuntu-latest
    needs: ["documentation-passes-lint"]
    steps:
      - run: echo documentation-is-ready
  documentation-passes-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/js-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-markdownlint
      - name: textlint
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/js-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-textlint
  published:
    runs-on: ubuntu-latest
    needs: ["ready-to-publish"]
    steps:
      - run: echo published
  ready-to-publish:
    runs-on: ubuntu-latest
    needs: ["artifact-ready", "documentation-is-ready", "source-is-secure"]
    steps:
      - run: echo ready-to-publish
  source-is-ready:
    runs-on: ubuntu-latest
    needs: ["source-is-tested", "source-passes-lint"]
    steps:
      - run: echo source-is-ready
  source-is-secure:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: /app/.cache/osv
    steps:
      - uses: actions/checkout@v7
      - name: restore grype-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scanner-db/grype-db
          key: scanner-db-grype-db-
          restore-keys: |
            scanner-db-grype-db-
      - name: grype-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-grype
          mounts: ${{ runner.temp }}/scanner-db/grype-db:/app/.cache/grype:ro
      - name: restore osv-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scanner-db/osv-db
          key: scanner-db-osv-db-
          restore-keys: |
            scanner-db-osv-db-
      - name: osv-scanner-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-osv-scanner --offline-vulnerabilities
          env: |-
            OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY=/app/.cache/osv
          mounts: ${{ runner.temp }}/scanner-db/osv-db:/app/.cache/osv:ro
      - name: restore trivy-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scanner-db/trivy-db
          key: scanner-db-trivy-db-
          restore-keys: |
            scanner-db-trivy-db-
      - name: trivy-scan-source
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-trivy fs
          env: |-
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/scanner-db/trivy-db:/app/.cache/trivy:ro
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: reports-source-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
