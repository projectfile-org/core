          mounts: ${{ runner.temp }}/ci-cache/grype-db:/app/.cache/grype:ro
      - name: restore osv-db
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/osv-db
          key: ci-cache-osv-db-
          restore-keys: |
            ci-cache-osv-db-
