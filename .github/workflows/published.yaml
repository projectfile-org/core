        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ env.M6E_TAG }}
          run: auto-trivy fs
          env: |-
            TRIVY_CACHE_BACKEND
          mounts: ${{ runner.temp }}/ci-cache/trivy-db:/app/.cache/trivy:ro
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: reports-source-is-secure-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
  source-is-tested:
    runs-on: ubuntu-latest
    steps:
