          run: pf-bridge coc --check
      - name: pf-bridge-codeowners-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge codeowners --check
      - name: pf-bridge-contributing-md-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge contributing --check
      - name: pf-bridge-fragments-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge fragments --check
      - name: pf-bridge-gitattributes-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge gitattributes --check
      - name: pf-bridge-gitignore-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge ignore .gitignore --check
      - name: pf-bridge-grype-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge vulnerabilities .grype.yaml --check
      - name: pf-bridge-license-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge license --check
      - name: pf-bridge-osv-check
