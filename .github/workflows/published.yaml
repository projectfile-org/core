---
name: published
"on":
  push: {}
  pull_request: {}
  workflow_dispatch:
env:
  M6E_TAG: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
  M6E_RUN_SCOPE: ${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  artifact-ready:
    runs-on: ubuntu-latest
    needs: ["built"]
    steps:
      - run: echo artifact-ready
  built:
    runs-on: ubuntu-latest
    needs: ["source-is-ready"]
    steps:
      - run: echo built
  module-published:
    runs-on: ubuntu-latest
    needs: ["ready-to-publish"]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - run: echo module-published
  projectfile-is-synced:
    runs-on: ubuntu-latest
    needs: ["projectfile-is-valid"]
    steps:
      - uses: actions/checkout@v7
      - name: ci-check
        run: ci-check
      - name: pf-bridge-citation-cff-check
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.PF_DOCKER_REGISTRY }}/projectfile/bridge
          version: ${{ env.M6E_TAG }}
          run: pf-bridge cff CITATION.cff --check
      - name: pf-bridge-claudeignore-check
        uses: projectfile/ci-actions/run-tool@v1
