          version: ${{ env.M6E_TAG }}
          run: auto-golangci-lint
          env: |-
            GOPROXY
          mounts: ${{ runner.temp }}/ci-cache/go:/app/.cache/go:rw
      - name: save go
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-${{ github.run_id }}
      - name: restore go
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ci-cache/go
          key: ci-cache-go-
          restore-keys: |
            ci-cache-go-
      - name: gosec
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/go-tools
          version: ${{ env.M6E_TAG }}
