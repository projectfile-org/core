          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: go test ./...
          env: |-
            GOPROXY
  source-passes-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cffr-validate
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.D9T_DOCKER_REGISTRY }}/d9t/r-tools
          version: ${{ vars.BASE_IMAGE_DEFAULT_VERSION || 'latest' }}
          run: auto-cffr-validate
      - name: go-vet
        uses: projectfile/ci-actions/run-tool@v1
        with:
          image: ${{ vars.B19_DOCKER_REGISTRY }}/b19/go
